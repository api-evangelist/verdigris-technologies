aid: verdigris-technologies
name: Verdigris Technologies
description: >-
  Verdigris Technologies builds AI-powered building energy intelligence, pairing
  proprietary current-sensor hardware clamped onto a building's electrical panels
  with cloud software that monitors every circuit in real time. The Verdigris API
  exposes that telemetry through OAuth2-secured REST endpoints (the Data API v4):
  energy, power, voltage, current, power factor, total harmonic distortion,
  weather, energy forecasts, building controls, and high-resolution Pro Capture
  waveforms, all queryable at building, panel, circuit, and breaker granularity
  with batch variants for pulling many entities in a single request. Developers
  use it to power enterprise data lakes, internal power-monitoring dashboards, and
  sustainability and energy-optimization applications for smart buildings.
